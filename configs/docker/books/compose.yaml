services:

  book-drop:
    build:
      context: https://github.com/eitan12345om/book-drop.git
      dockerfile: ./Dockerfile
    container_name: book-drop
    networks:
      - docktail
    restart: unless-stopped
    labels:
      - docktail.service.enable=true
      - docktail.service.name=kobo
      - docktail.service.port=3001
      - docktail.service.service-port=443
      - docktail.funnel.enable=true
      - docktail.funnel.port=3001
      - docktail.funnel.funnel-port=8443

  calibre-web-automated:
    image: ghcr.io/new-usemame/calibre-web-nextgen:latest
    container_name: calibre-web-automated
    volumes:
      - /mnt/data/calibre-web-automated:/config
      - /mnt/pool/data/cwa-book-ingest:/cwa-book-ingest
      - /mnt/pool/books/ebook:/calibre-library
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      - HARDCOVER_TOKEN=your_hardcover_api_key_here
    networks:
      - docktail
    restart: unless-stopped
    labels:
      - docktail.service.enable=true
      - docktail.service.name=books
      - docktail.service.port=8083
      - docktail.service.service-port=443

networks:
  docktail:
    name: docktail
    external: true
