services:

  jellyfin:
    image: ghcr.io/hotio/jellyfin:latest
    container_name: jellyfin
    volumes:
      - /mnt/data/jellyfin:/config
      - /mnt/pool:/downloads:ro
    environment:
      - PGID=0
      - PUID=0
      - TZ=America/Chicago
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=pia
      - VPN_LAN_NETWORK=192.168.1.0/24
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_PORT_REDIRECTS=8096/tcp
      - VPN_PIA_USER=${VPN_PIA_USER}
      - VPN_PIA_PASS=${VPN_PIA_PASS}
      - VPN_PIA_PREFERRED_REGION=ca_toronto
    networks:
      - docktail
    hostname: jellyfin
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/dri:/dev/dri
    labels:
      - docktail.service.enable=true
      - docktail.service.name=jelly
      - docktail.service.port=8096
      - docktail.service.service-port=443
      - docktail.funnel.enable=true
      - docktail.funnel.port=8096
      - docktail.funnel.funnel-port=443

networks:
  docktail:
    name: docktail
    external: true
