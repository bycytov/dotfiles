services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    volumes:
      - /mnt/data/beets:/config
      - /mnt/pool:/downloads
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
    networks:
      - tsbridge
    restart: unless-stopped

  clonarr:
    image: ghcr.io/prophetse7en/clonarr:latest
    container_name: clonarr
    volumes:
      - /mnt/data/clonarr:/config
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    ports:
      - '6060:6060'
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=false
      - tsbridge.service.name=profile
      - tsbridge.service.port=6060
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  crosswatch:
    image: ghcr.io/cenodude/crosswatch:latest
    container_name: crosswatch
    volumes:
      - /mnt/data/crosswatch:/config
    environment:
      - TZ=America/Chicago
      - APP_UID=0
      - APP_GID=0
      - APP_USER=root
      - APP_GROUP=root
    ports:
      - '8787:8787'
    networks:
      - tsbridge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5)); raise SystemExit(0 if data.get('ok') is True and data.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - tsbridge.enabled=false
      - tsbridge.service.name=sync
      - tsbridge.service.port=8787
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  kometa:
    image: kometateam/kometa:latest
    container_name: kometa
    depends_on:
      plex:
        condition: service_healthy
    volumes:
      - /mnt/data/kometa:/config
    environment:
      - TZ=America/Chicago
      - KOMETA_RUN=true
    networks:
      - tsbridge

  plex:
    image: ghcr.io/hotio/plex:latest
    container_name: plex
    volumes:
      - /mnt/data/plex:/config
      - /mnt/pool:/pool
      - /tmp/plex:/transcode
    environment:
      - PUID=0
      - PGID=0
      - UMASK=002
      - TZ=America/Chicago
      - WEBUI_PORTS=32400/tcp
      - PLEX_CLAIM_TOKEN= # visit plex.tv/claim leave blank after initial claim
      - PLEX_ADVERTISE_URL=
      - PLEX_NO_AUTH_NETWORKS=192.168.1.0/24
      - PLEX_BETA_INSTALL=false
      - PLEX_PURGE_CODECS=false
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:32400/identity" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    devices:
      - /dev/dri:/dev/dri

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    volumes:
      - /mnt/data/prowlarr:/config
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=search
      - tsbridge.service.port=9696
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    volumes:
      - /mnt/data/qbittorrent:/config
      - /mnt/pool:/downloads
    environment:
      - PGID=0
      - PUID=0
      - TZ=America/Chicago
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=pia
      - VPN_LAN_NETWORK=192.168.1.0/24
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_PIA_USER=${VPN_PIA_USER}
      - VPN_PIA_PASS=${VPN_PIA_PASS}
      - VPN_PIA_PREFERRED_REGION=ca_toronto
    networks:
      - tsbridge
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1

  qui:
    image: ghcr.io/hotio/qui:latest
    container_name: qui
    volumes:
      - /mnt/data/qui:/config
      - /mnt/data/qbittorrent:/qbittorrent:ro
      - /mnt/pool:/downloads
    environment:
      - PUID=0
      - PGID=0
      - UMASK=002
      - TZ=America/Chicago
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=torrent
      - tsbridge.service.port=7476
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    volumes:
      - /mnt/data/radarr:/config
      - /mnt/pool:/downloads
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=movies
      - tsbridge.service.port=7878
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  recommendations_movie:
    build:
      context: https://github.com/netplexflix/Movie-Recommendations-for-Plex.git#main
      no_cache: true
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY . /app
        RUN if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
        CMD ["python", "MRFP.py"]
    container_name: recommendations_movie
    volumes:
      - /mnt/data/scripts/MRFP/config.yml:/app/config.yml
      - /mnt/data/scripts/MRFP/cache:/app/cache
      - /mnt/data/scripts/MRFP/logs:/app/Logs
    networks:
      - tsbridge

  recommendations_show:
    build:
      context: https://github.com/netplexflix/TV-Show-Recommendations-for-Plex.git#main
      no_cache: true
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY . /app
        RUN if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
        CMD ["python", "TRFP.py"]
    container_name: recommendations_show
    volumes:
      - /mnt/data/scripts/TRFP/config.yml:/app/config.yml
      - /mnt/data/scripts/TRFP/cache:/app/cache
      - /mnt/data/scripts/TRFP/logs:/app/Logs
    networks:
      - tsbridge

  rmlint:
    build:
      context: .
      no_cache: true
      dockerfile_inline: |
        FROM alpine:edge
        RUN apk add --no-cache bash --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing rmlint
    container_name: rmlint
    volumes:
      - /mnt/pool:/data
    networks:
      - tsbridge
    command: bash -c "rmlint /data -C -c sh:hardlink -o sh:/tmp/rmlint.sh -o stats:/dev/stderr && bash /tmp/rmlint.sh -d"

  sabnzbd:
    image: ghcr.io/hotio/sabnzbd:latest
    container_name: sabnzbd
    volumes:
      - /mnt/data/sabnzbd:/config
      - /mnt/pool:/downloads
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=nzb
      - tsbridge.service.port=8080
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  scheduler:
    image: ghcr.io/netresearch/ofelia:latest
    container_name: scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Chicago
    networks:
      - tsbridge
    command: daemon
    restart: unless-stopped
    labels:
      - ofelia.job-run.kometa.schedule=0 5 * * *
      - ofelia.job-run.kometa.container=kometa
      - ofelia.job-run.rmlint.schedule=0 0 5 * *
      - ofelia.job-run.rmlint.container=rmlint
      - ofelia.job-run.recommendations_movie.schedule=55 4 * * *
      - ofelia.job-run.recommendations_movie.container=recommendations_movie
      - ofelia.job-run.recommendations_show.schedule=55 4 * * *
      - ofelia.job-run.recommendations_show.container=recommendations_show

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    volumes:
      - /mnt/data/sonarr:/config
      - /mnt/pool:/downloads
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=tv
      - tsbridge.service.port=8989
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

  tautulli:
    image: ghcr.io/hotio/tautulli:latest
    container_name: tautulli
    volumes:
      - /mnt/data/tautulli:/config
    environment:
      - TZ=America/Chicago
      - PUID=0
      - PGID=0
    networks:
      - tsbridge
    restart: unless-stopped
    labels:
      - tsbridge.enabled=true
      - tsbridge.service.name=stats
      - tsbridge.service.port=8181
      - tsbridge.service.funnel_enabled=false
      - tsbridge.service.ephemeral=true

networks:
  tsbridge:
    name: tsbridge
    external: true
